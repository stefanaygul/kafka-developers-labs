spring:
  application:
    name: order-streams
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    streams:
      application-id: order-streams
      state-dir: target/kafka-streams-state
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # Eski lab'lerde orders'a elle yazılmış JSON olmayan kayıtlar olabilir. Uygulama durmasin (slayt 74).
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
        # Her ara sonucu görmek için cache kapalı ve commit sık (slayt 71).
        statestore.cache.max.bytes: 0
        commit.interval.ms: 500

app:
  orders-topic: orders
  customers-topic: customers
  high-value-topic: orders-high
  enriched-topic: orders-enriched
  counts-topic: order-counts-5m
  high-value-threshold: 10000

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.streams.StreamsConfig: WARN
    org.apache.kafka.streams.processor.internals: WARN
    org.apache.kafka.streams.KafkaStreams: INFO
