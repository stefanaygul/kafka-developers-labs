server:
  port: ${ORDER_AVRO_PORT:8084}

spring:
  application:
    name: order-avro
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    properties:
      schema.registry.url: http://localhost:${SCHEMA_REGISTRY_PORT:8081}
      specific.avro.reader: true
      auto.register.schemas: true # production: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

app:
  # JSON ve Avro kayıtları karışmasın diye ayrı topic.
  topic: orders-avro
  group: order-avro-reader

logging:
  level:
    org.apache.kafka.clients: WARN
    io.confluent: WARN
